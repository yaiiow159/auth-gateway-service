# 本機開發用的相依服務。
# 應用程式本身以 mvn spring-boot:run 或 java -jar 啟動，方便熱重啟與除錯。
services:
  redis:
    image: redis:7-alpine
    container_name: auth-gateway-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
